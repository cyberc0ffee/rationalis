# Costruisce e verifica Rationalis su macOS (Apple Silicon e Intel) e Windows.
# Si avvia a mano da GitHub (Actions > build > Run workflow) o a ogni tag v*; i pacchetti si scaricano
# dalla pagina dell'esecuzione (sezione Artifacts).
name: build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14        # Apple Silicon (arm64)
          - os: macos-15-intel  # Intel (x86_64)
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dipendenze
        run: |
          python -m pip install --upgrade pip
          # solo pacchetti già compilati: se manca la ruota per la piattaforma (Mac Intel), pip sceglie una
          # versione precedente di cryptography con OpenSSL incluso invece di compilarla contro quello di sistema
          python -m pip install --only-binary=cryptography -r requirements.txt pytest pyinstaller pillow
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: Pacchetto
        run: python tools_build/build_portable.py
      - uses: actions/upload-artifact@v4
        with:
          name: rationalis-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
