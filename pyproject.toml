[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rationalis"
version = "1.0.0"
description = "Gestione e analisi finanziaria personale e aziendale"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.6", "openpyxl>=3.1", "access-parser>=0.0.5", "cryptography>=42"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.gui-scripts]
rationalis = "rationalis.ui.app:main"

[tool.setuptools.packages.find]
include = ["rationalis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# su Windows QPrinter genera eccezioni COM gestite internamente che il faulthandler segnalerebbe come fatali
addopts = "-p no:faulthandler"
